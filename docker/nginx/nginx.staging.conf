# Staging mirror of nginx.conf — same routing, no TLS termination.
# Staging is reachable on a different host port (see docker-compose.staging.yml)
# and is typically fronted by the prod TLS (or accessed over SSH/VPN),
# so this config terminates plain HTTP and skips the cert paths.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── Security headers (mirrors prod minus HSTS) ────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' challenges.cloudflare.com cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src challenges.cloudflare.com 'self'; font-src 'self' cdn.jsdelivr.net;" always;

    # ── React SPA ─────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── Django (API + admin + static) ─────────────────────────────────────────
    location ~ ^/(api|admin|static)/ {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
