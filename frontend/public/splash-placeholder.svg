<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="OpenChapters — open-source textbooks, assembled to order">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#1f1320"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafaf6"/>
      <stop offset="1" stop-color="#e6e2d6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6a47a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d6a47a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M 30 1 L 59 17 L 59 35 L 30 51 L 1 35 L 1 17 Z"
            fill="none" stroke="#8ab3d9" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>

  <style><![CDATA[
    /* Drift-in keyframes — each card ends at its resting rotation */
    @keyframes drift-1 {
      0%   { transform: translate(-700px, 120px) rotate(18deg); opacity: 0; }
      100% { transform: translate(0, 0)         rotate(-8deg);  opacity: 0.97; }
    }
    @keyframes drift-2 {
      0%   { transform: translate(700px, -120px) rotate(-18deg); opacity: 0; }
      100% { transform: translate(0, 0)          rotate(7deg);   opacity: 0.97; }
    }
    @keyframes drift-3 {
      0%   { transform: translate(-500px, -500px) rotate(-22deg); opacity: 0; }
      100% { transform: translate(0, 0)           rotate(-4deg);  opacity: 0.97; }
    }
    @keyframes drift-4 {
      0%   { transform: translate(500px, 500px) rotate(22deg); opacity: 0; }
      100% { transform: translate(0, 0)         rotate(6deg);  opacity: 0.97; }
    }
    @keyframes fade-up {
      0%   { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0);    opacity: 1; }
    }
    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0; }
      80%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

    .card  { transform-box: fill-box; transform-origin: center;
             animation-duration: 1.4s; animation-fill-mode: both;
             animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    .card-1 { animation-name: drift-1; animation-delay: 0.15s; }
    .card-2 { animation-name: drift-2; animation-delay: 0.30s; }
    .card-3 { animation-name: drift-3; animation-delay: 0.45s; }
    .card-4 { animation-name: drift-4; animation-delay: 0.60s; }

    .emblem  { transform-box: fill-box; transform-origin: center;
               animation: pop 0.9s cubic-bezier(.2,.9,.3,1.3) 1.0s both; }
    .title   { animation: fade-up 1.0s ease-out 1.25s both; }
    .tagline { animation: fade-up 1.0s ease-out 1.55s both; }
    .hint    { animation: fade-up 1.0s ease-out 2.0s both,
                          pulse 2.6s ease-in-out 3.2s infinite; }

    .orbit { transform-box: view-box; transform-origin: 800px 470px;
             animation: orbit 80s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .card, .emblem, .title, .tagline, .hint, .orbit { animation: none; opacity: 1; }
    }
  ]]></style>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#hex)"/>

  <!-- Soft halo behind the emblem -->
  <circle cx="800" cy="470" r="320" fill="url(#halo)"/>

  <!-- Slowly orbiting accent dots -->
  <g class="orbit">
    <circle cx="800" cy="270" r="4" fill="#7aa6d6" opacity="0.75"/>
    <circle cx="1000" cy="470" r="5" fill="#d6a47a" opacity="0.65"/>
    <circle cx="800" cy="670" r="4" fill="#7ad6a4" opacity="0.75"/>
    <circle cx="600" cy="470" r="5" fill="#d67aa6" opacity="0.65"/>
  </g>

  <!-- Chapter card 1: Crystal Structures -->
  <g transform="translate(380 300)">
    <g class="card card-1">
      <rect width="240" height="320" rx="8" fill="url(#paper)"/>
      <rect x="0" y="0" width="240" height="40" rx="8" fill="#7aa6d6" opacity="0.85"/>
      <text x="120" y="27" text-anchor="middle" font-family="Georgia, serif"
            font-size="14" fill="#fafaf6" letter-spacing="1">CHAPTER 1</text>
      <text x="20" y="80" font-family="Georgia, serif" font-size="22"
            font-weight="700" fill="#1a1f2e">Crystal</text>
      <text x="20" y="108" font-family="Georgia, serif" font-size="22"
            font-weight="700" fill="#1a1f2e">Structures</text>
      <!-- mini cubic lattice -->
      <g transform="translate(60 150)" stroke="#1a1f2e" stroke-width="1.2" fill="none">
        <rect x="0" y="0" width="80" height="80"/>
        <line x1="0" y1="0" x2="40" y2="-30"/>
        <line x1="80" y1="0" x2="120" y2="-30"/>
        <line x1="0" y1="80" x2="40" y2="50"/>
        <line x1="80" y1="80" x2="120" y2="50"/>
        <rect x="40" y="-30" width="80" height="80"/>
        <circle cx="0"   cy="0"  r="4" fill="#1a1f2e"/>
        <circle cx="80"  cy="0"  r="4" fill="#1a1f2e"/>
        <circle cx="40"  cy="-30" r="4" fill="#1a1f2e"/>
        <circle cx="120" cy="-30" r="4" fill="#1a1f2e"/>
        <circle cx="0"   cy="80" r="4" fill="#1a1f2e"/>
        <circle cx="80"  cy="80" r="4" fill="#1a1f2e"/>
        <circle cx="40"  cy="50" r="4" fill="#1a1f2e"/>
        <circle cx="120" cy="50" r="4" fill="#1a1f2e"/>
      </g>
      <line x1="20" y1="270" x2="220" y2="270" stroke="#c8c4b8" stroke-width="1"/>
      <line x1="20" y1="288" x2="200" y2="288" stroke="#d8d4c8" stroke-width="1"/>
      <line x1="20" y1="304" x2="190" y2="304" stroke="#d8d4c8" stroke-width="1"/>
    </g>
  </g>

  <!-- Chapter card 2: Phase Diagrams -->
  <g transform="translate(980 260)">
    <g class="card card-2">
      <rect width="240" height="320" rx="8" fill="url(#paper)"/>
      <rect x="0" y="0" width="240" height="40" rx="8" fill="#d6a47a" opacity="0.85"/>
      <text x="120" y="27" text-anchor="middle" font-family="Georgia, serif"
            font-size="14" fill="#fafaf6" letter-spacing="1">CHAPTER 2</text>
      <text x="20" y="80" font-family="Georgia, serif" font-size="22"
            font-weight="700" fill="#1a1f2e">Phase</text>
      <text x="20" y="108" font-family="Georgia, serif" font-size="22"
            font-weight="700" fill="#1a1f2e">Diagrams</text>
      <!-- mini phase diagram -->
      <g transform="translate(20 140)">
        <line x1="0" y1="120" x2="200" y2="120" stroke="#1a1f2e" stroke-width="1"/>
        <line x1="0" y1="0"   x2="0"   y2="120" stroke="#1a1f2e" stroke-width="1"/>
        <path d="M 0 80 Q 60 20 100 30 Q 150 40 200 30"
              fill="none" stroke="#7aa6d6" stroke-width="2"/>
        <path d="M 0 100 Q 60 90 100 80 Q 150 70 200 60"
              fill="none" stroke="#d67aa6" stroke-width="2"/>
        <text x="100" y="155" text-anchor="middle" font-family="Georgia, serif"
              font-style="italic" font-size="12" fill="#5a6470">composition</text>
      </g>
      <line x1="20" y1="304" x2="190" y2="304" stroke="#d8d4c8" stroke-width="1"/>
    </g>
  </g>

  <!-- Chapter card 3: Defects -->
  <g transform="translate(220 500)">
    <g class="card card-3">
      <rect width="240" height="320" rx="8" fill="url(#paper)"/>
      <rect x="0" y="0" width="240" height="40" rx="8" fill="#7ad6a4" opacity="0.85"/>
      <text x="120" y="27" text-anchor="middle" font-family="Georgia, serif"
            font-size="14" fill="#1a3024" letter-spacing="1">CHAPTER 7</text>
      <text x="20" y="80" font-family="Georgia, serif" font-size="22"
            font-weight="700" fill="#1a1f2e">Defects</text>
      <line x1="20" y1="100" x2="220" y2="100" stroke="#c8c4b8" stroke-width="1"/>
      <!-- atomic lattice with a vacancy + interstitial -->
      <g transform="translate(40 130)" opacity="0.85">
        <g fill="#1a1f2e">
          <circle cx="0"   cy="0"  r="6"/><circle cx="40"  cy="0"  r="6"/>
          <circle cx="80"  cy="0"  r="6"/><circle cx="120" cy="0"  r="6"/>
          <circle cx="160" cy="0"  r="6"/>
          <circle cx="0"   cy="40" r="6"/><circle cx="40"  cy="40" r="6"/>
          <!-- vacancy at (80,40) -->
          <circle cx="120" cy="40" r="6"/><circle cx="160" cy="40" r="6"/>
          <circle cx="0"   cy="80" r="6"/><circle cx="40"  cy="80" r="6"/>
          <circle cx="80"  cy="80" r="6"/><circle cx="120" cy="80" r="6"/>
          <circle cx="160" cy="80" r="6"/>
          <circle cx="0"   cy="120" r="6"/><circle cx="40"  cy="120" r="6"/>
          <circle cx="80"  cy="120" r="6"/><circle cx="120" cy="120" r="6"/>
          <circle cx="160" cy="120" r="6"/>
        </g>
        <!-- vacancy outline -->
        <circle cx="80" cy="40" r="7" fill="none" stroke="#d67a7a" stroke-width="1.5" stroke-dasharray="2 2"/>
        <!-- interstitial -->
        <circle cx="60" cy="60" r="4" fill="#d6a47a"/>
      </g>
      <line x1="20" y1="290" x2="200" y2="290" stroke="#d8d4c8" stroke-width="1"/>
      <line x1="20" y1="306" x2="180" y2="306" stroke="#d8d4c8" stroke-width="1"/>
    </g>
  </g>

  <!-- Chapter card 4: Diffusion -->
  <g transform="translate(1100 520)">
    <g class="card card-4">
      <rect width="240" height="320" rx="8" fill="url(#paper)"/>
      <rect x="0" y="0" width="240" height="40" rx="8" fill="#d67aa6" opacity="0.85"/>
      <text x="120" y="27" text-anchor="middle" font-family="Georgia, serif"
            font-size="14" fill="#fafaf6" letter-spacing="1">CHAPTER 12</text>
      <text x="20" y="80" font-family="Georgia, serif" font-size="22"
            font-weight="700" fill="#1a1f2e">Diffusion</text>
      <line x1="20" y1="100" x2="220" y2="100" stroke="#c8c4b8" stroke-width="1"/>
      <!-- Fick's first law -->
      <text x="120" y="150" text-anchor="middle" font-family="Georgia, serif"
            font-style="italic" font-size="22" fill="#1a1f2e">J = −D </text>
      <text x="148" y="148" font-family="Georgia, serif" font-style="italic"
            font-size="22" fill="#1a1f2e">∂c</text>
      <line x1="148" y1="156" x2="186" y2="156" stroke="#1a1f2e" stroke-width="1.2"/>
      <text x="148" y="178" font-family="Georgia, serif" font-style="italic"
            font-size="22" fill="#1a1f2e">∂x</text>
      <!-- concentration gradient -->
      <g transform="translate(20 200)">
        <line x1="0" y1="60" x2="200" y2="60" stroke="#1a1f2e" stroke-width="1"/>
        <path d="M 0 10 Q 100 10 100 50 Q 100 90 200 90"
              fill="none" stroke="#7aa6d6" stroke-width="2"/>
        <text x="100" y="110" text-anchor="middle" font-family="Georgia, serif"
              font-style="italic" font-size="11" fill="#5a6470">position</text>
      </g>
    </g>
  </g>

  <!-- Central OC emblem -->
  <g class="emblem" transform="translate(800 470)">
    <circle r="90" fill="none" stroke="#d6a47a" stroke-width="1.5" opacity="0.55"/>
    <circle r="74" fill="#0a1628" opacity="0.85"/>
    <circle r="74" fill="none" stroke="#fafaf6" stroke-width="1.2" opacity="0.7"/>
    <text text-anchor="middle" y="24" font-family="Georgia, serif"
          font-size="68" font-weight="700" fill="#fafaf6"
          letter-spacing="-2">OC</text>
  </g>

  <!-- Title + tagline -->
  <g class="title">
    <text x="800" y="130" text-anchor="middle" font-family="Georgia, serif"
          font-size="74" font-weight="700" fill="#fafaf6"
          letter-spacing="-1">OpenChapters</text>
  </g>
  <g class="tagline">
    <text x="800" y="180" text-anchor="middle" font-family="Georgia, serif"
          font-size="24" font-style="italic" fill="#a8b0bc">
      Open-source textbooks, assembled to order
    </text>
  </g>

  <!-- Bottom hint -->
  <g class="hint">
    <text x="800" y="850" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif"
          font-size="13" fill="#8a94a4" letter-spacing="3">
      CLICK ANYWHERE TO CONTINUE
    </text>
  </g>
</svg>
